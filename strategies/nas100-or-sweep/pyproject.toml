[project]
name = "nas100-or-sweep"
version = "0.1.0"
description = "Research and backtest of NAS100 NY AM Open Range sweep-and-reversal strategy"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "plotly>=5.22",
    "seaborn>=0.13",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
