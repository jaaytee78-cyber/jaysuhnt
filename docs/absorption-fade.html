<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absorption Fade v2 — Delta Confluence Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#05080e; --bg2:#080d15; --bg3:#0d1520; --bg4:#111d2a;
  --border:#182436; --border2:#1e2f44;
  --accent:#00c8ff; --accent2:#00ff99; --accent3:#ff3d5f; --accent4:#ffb526;
  --blue:#4d9fff; --purple:#9d6fff;
  --text:#a8c4dc; --text2:#6a8eaa; --bright:#ddeeff;
  --mono:'JetBrains Mono',monospace;
  --sans:'Space Grotesk',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.65;min-height:100vh;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,200,255,0.008) 3px,rgba(0,200,255,0.008) 4px);pointer-events:none;z-index:9999}

/* NAV */
.topnav{position:sticky;top:0;z-index:100;background:rgba(5,8,14,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0;height:52px}
.nav-logo{display:flex;align-items:center;gap:12px;padding:0 20px;border-right:1px solid var(--border);height:100%;min-width:180px}
.nav-logo-box{width:32px;height:32px;border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.nav-logo-box::after{content:'';position:absolute;inset:3px;border:1px solid rgba(0,200,255,0.2)}
.nav-logo-text{font-family:var(--mono);font-size:9px;color:var(--accent);font-weight:600}
.nav-brand{font-family:var(--mono);font-size:11px;color:var(--bright);letter-spacing:0.06em;line-height:1.2}
.nav-brand small{display:block;font-size:8px;color:var(--text2);letter-spacing:0.12em}
.nav-tabs{display:flex;height:100%;flex:1;overflow-x:auto}
.nav-tab{display:flex;align-items:center;gap:8px;padding:0 18px;height:100%;font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--text2);cursor:pointer;border-right:1px solid var(--border);border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;text-transform:uppercase;user-select:none}
.nav-tab:hover{color:var(--bright);background:rgba(0,200,255,0.04)}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(0,200,255,0.06)}
.nav-tab .tab-icon{font-size:12px;opacity:0.7}
.nav-tab .tab-num{font-size:8px;opacity:0.5;margin-left:2px}
.nav-right{padding:0 14px;border-left:1px solid var(--border);height:100%;display:flex;align-items:center;gap:10px}
.live-dot{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;color:var(--text2);letter-spacing:0.1em}
.live-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.nav-btn{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;padding:5px 9px;border:1px solid var(--border);color:var(--text2);background:transparent;cursor:pointer;text-transform:uppercase}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}

/* PAGE */
.page-wrap{display:none;max-width:1120px;margin:0 auto;padding:28px 20px}
.page-wrap.active{display:block;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}


/* HERO */
.hero{padding:36px 32px;border:1px solid var(--border);background:linear-gradient(135deg,#0a1828 0%,var(--bg2) 100%);margin-bottom:24px;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 50%,rgba(0,200,255,0.04),transparent 60%);pointer-events:none}
.hero-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:0.22em;color:var(--accent);text-transform:uppercase;margin-bottom:12px}
.hero-title{font-size:32px;font-weight:700;color:var(--bright);letter-spacing:-0.02em;line-height:1.1;margin-bottom:8px}
.hero-title em{color:var(--accent);font-style:normal}
.hero-sub{font-size:14px;color:var(--text);max-width:680px;line-height:1.6;margin-bottom:18px}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-family:var(--mono);font-size:8px;letter-spacing:0.14em;padding:4px 10px;border:1px solid;text-transform:uppercase}
.b-blue{border-color:rgba(0,200,255,0.3);color:var(--accent);background:rgba(0,200,255,0.06)}
.b-green{border-color:rgba(0,255,153,0.3);color:var(--accent2);background:rgba(0,255,153,0.06)}
.b-amber{border-color:rgba(255,181,38,0.3);color:var(--accent4);background:rgba(255,181,38,0.06)}
.b-dim{border-color:var(--border);color:var(--text2);background:transparent}
.b-red{border-color:rgba(255,61,95,0.3);color:var(--accent3);background:rgba(255,61,95,0.06)}

/* STAT STRIP */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:24px}
.stat-card{background:var(--bg2);padding:16px 18px;position:relative}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat-card.blue::before{background:var(--accent)}
.stat-card.green::before{background:var(--accent2)}
.stat-card.red::before{background:var(--accent3)}
.stat-card.amber::before{background:var(--accent4)}
.stat-label{font-family:var(--mono);font-size:8px;letter-spacing:0.16em;color:var(--text2);text-transform:uppercase;margin-bottom:4px}
.stat-val{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--bright);line-height:1;margin-bottom:2px}
.stat-val.blue{color:var(--accent)}.stat-val.green{color:var(--accent2)}.stat-val.red{color:var(--accent3)}.stat-val.amber{color:var(--accent4)}
.stat-sub{font-family:var(--mono);font-size:8px;color:var(--text2)}

/* SECTION HEADER */
.sec-head{font-family:var(--mono);font-size:8px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px;margin-top:12px}
.sec-head::after{content:'';flex:1;height:1px;background:var(--border)}

/* PANEL */
.panel{background:var(--bg2);border:1px solid var(--border);margin-bottom:16px}
.panel-hd{padding:11px 16px;border-bottom:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--bright);text-transform:uppercase;font-weight:500}
.ptag{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;text-transform:uppercase;padding:2px 8px;border:1px solid}
.ptag-blue{color:var(--accent);border-color:rgba(0,200,255,0.25)}
.ptag-green{color:var(--accent2);border-color:rgba(0,255,153,0.25)}
.ptag-amber{color:var(--accent4);border-color:rgba(255,181,38,0.25)}
.ptag-red{color:var(--accent3);border-color:rgba(255,61,95,0.25)}
.ptag-dim{color:var(--text2);border-color:var(--border)}
.panel-body{padding:16px}

/* GRID */
.two-col{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-bottom:16px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px}


/* TABLE */
.tbl{width:100%;border-collapse:collapse}
.tbl tr{border-bottom:1px solid var(--border)}
.tbl tr:last-child{border-bottom:none}
.tbl th{background:var(--bg3);font-family:var(--mono);font-size:9px;letter-spacing:0.1em;color:var(--text2);text-transform:uppercase;padding:9px 12px;text-align:left;font-weight:400}
.tbl td{padding:9px 12px;font-size:12px;vertical-align:top;line-height:1.45}
.tbl tr:nth-child(even) td{background:rgba(13,21,32,0.5)}
.tbl td.mono{font-family:var(--mono);font-size:10px;color:var(--accent);white-space:nowrap}
.tbl td.bold{font-weight:600;color:var(--bright)}
.tbl td.green{color:var(--accent2)}.tbl td.red{color:var(--accent3)}.tbl td.amber{color:var(--accent4)}

/* CONDITION ROWS */
.cond-list{display:flex;flex-direction:column;gap:3px}
.cond-row{display:grid;grid-template-columns:36px 1fr auto;align-items:start;gap:12px;padding:12px 14px;background:var(--bg3);border-left:3px solid var(--border2);transition:border-color 0.15s}
.cond-row:hover{border-left-color:var(--accent)}
.cond-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent)}
.cond-name{font-size:12px;font-weight:600;color:var(--bright);margin-bottom:2px}
.cond-desc{font-size:11px;color:var(--text);line-height:1.5}
.cond-code{font-family:var(--mono);font-size:9px;color:var(--text2);margin-top:4px;line-height:1.5}
.cond-tag{font-family:var(--mono);font-size:8px;padding:2px 7px;margin-top:1px;white-space:nowrap}
.ct-long{background:rgba(0,255,153,0.08);color:var(--accent2);border:1px solid rgba(0,255,153,0.2)}
.ct-short{background:rgba(255,61,95,0.08);color:var(--accent3);border:1px solid rgba(255,61,95,0.2)}
.ct-both{background:rgba(0,200,255,0.06);color:var(--accent);border:1px solid rgba(0,200,255,0.18)}
.ct-manual{background:rgba(255,181,38,0.08);color:var(--accent4);border:1px solid rgba(255,181,38,0.2)}

/* CHECKLIST */
.checklist{display:flex;flex-direction:column;gap:4px}
.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--bg3);border-left:2px solid var(--border2)}
.check-item.long{border-left-color:var(--accent2)}
.check-item.short{border-left-color:var(--accent3)}
.check-icon{font-family:var(--mono);font-size:10px;width:16px;flex-shrink:0;margin-top:1px}
.check-icon.long{color:var(--accent2)}.check-icon.short{color:var(--accent3)}.check-icon.neutral{color:var(--text2)}
.check-text{font-size:12px;color:var(--text);line-height:1.4}
.check-text strong{color:var(--bright)}

/* FLOW */
.flow{display:flex;flex-direction:column;gap:2px}
.flow-step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:12px 14px;background:var(--bg3);align-items:start}
.flow-n{width:28px;height:28px;border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--accent);flex-shrink:0}
.flow-title{font-size:12px;font-weight:600;color:var(--bright);margin-bottom:2px}
.flow-desc{font-size:11px;color:var(--text);line-height:1.5}
.flow-arr{text-align:center;font-family:var(--mono);font-size:11px;color:var(--border2);padding:2px 0}

/* KILL */
.kill-list{display:flex;flex-direction:column;gap:4px}
.kill-item{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(255,61,95,0.05);border:1px solid rgba(255,61,95,0.12);font-size:12px;color:var(--text)}
.kill-item::before{content:'⊗';font-family:var(--mono);font-size:10px;color:var(--accent3);flex-shrink:0}


/* SCORE GRID */
.score-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:14px}
.score-cell{display:flex;flex-direction:column;align-items:center;padding:12px 6px;border:1px solid var(--border);background:var(--bg3);position:relative}
.score-cell.s5{border-color:rgba(0,255,153,0.4);background:rgba(0,255,153,0.04)}
.score-cell.s5::before{content:'▲ SIGNAL';position:absolute;top:-8px;font-family:var(--mono);font-size:7px;color:var(--accent2);background:var(--bg3);padding:0 4px;letter-spacing:0.08em}
.score-n{font-family:var(--mono);font-size:22px;font-weight:500;line-height:1;margin-bottom:3px}
.s0 .score-n,.s1 .score-n{color:var(--text2)}
.s2 .score-n{color:#4d7a9f}
.s3 .score-n{color:var(--accent4)}
.s4 .score-n{color:#88dd44}
.s5 .score-n{color:var(--accent2)}
.score-lbl{font-family:var(--mono);font-size:8px;letter-spacing:0.08em;text-align:center;line-height:1.3;color:var(--text2)}
.s5 .score-lbl{color:var(--accent2)}

/* INTERACTIVE CHECKLIST */
.int-check{display:flex;flex-direction:column;gap:6px}
.int-check-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--bg3);border:1px solid var(--border2);cursor:pointer;transition:all 0.15s;user-select:none}
.int-check-item:hover{background:var(--bg4);border-color:var(--accent)}
.int-check-item.checked{background:rgba(0,255,153,0.06);border-color:rgba(0,255,153,0.3)}
.int-check-item.checked-short{background:rgba(255,61,95,0.06);border-color:rgba(255,61,95,0.3)}
.check-box{width:20px;height:20px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--mono);font-size:10px;transition:all 0.15s;margin-top:1px}
.int-check-item.checked .check-box{border-color:var(--accent2);background:rgba(0,255,153,0.15);color:var(--accent2)}
.int-check-item.checked-short .check-box{border-color:var(--accent3);background:rgba(255,61,95,0.15);color:var(--accent3)}
.check-box-inner{color:transparent;font-size:11px}
.int-label{font-size:12px;color:var(--text);line-height:1.4}
.int-label strong{color:var(--bright);font-weight:600}
.score-meter{background:var(--bg3);border:1px solid var(--border);padding:20px;margin-bottom:16px;text-align:center}
.meter-score{font-family:var(--mono);font-size:56px;font-weight:600;line-height:1;transition:color 0.3s}
.meter-label{font-family:var(--mono);font-size:10px;letter-spacing:0.15em;color:var(--text2);text-transform:uppercase;margin-bottom:4px}
.meter-status{font-size:13px;font-weight:600;margin-top:6px;transition:color 0.3s}
.meter-bar{height:6px;background:var(--border);margin-top:12px;position:relative}
.meter-fill{height:100%;background:var(--accent2);transition:width 0.4s ease,background 0.4s}

/* BUTTONS */
.btn{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;padding:8px 16px;border:1px solid;cursor:pointer;background:transparent;transition:all 0.15s}
.btn-green{color:var(--accent2);border-color:rgba(0,255,153,0.3)}
.btn-green:hover{background:rgba(0,255,153,0.1)}
.btn-red{color:var(--accent3);border-color:rgba(255,61,95,0.3)}
.btn-red:hover{background:rgba(255,61,95,0.1)}
.btn-blue{color:var(--accent);border-color:rgba(0,200,255,0.3)}
.btn-blue:hover{background:rgba(0,200,255,0.1)}
.btn-dim{color:var(--text2);border-color:var(--border)}
.btn-dim:hover{background:var(--bg3)}
@keyframes scorePulse{0%{transform:scale(1)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.score-pulse{animation:scorePulse 0.35s ease}


/* CODE BLOCK */
.code-wrap{position:relative}
.code-block{background:#020508;border:1px solid var(--border);padding:20px;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:#8badc0;overflow-x:auto;max-height:560px;overflow-y:auto;tab-size:4;white-space:pre}
.code-block .kw{color:#569cd6}
.code-block .cm{color:#3e6070;font-style:italic}
.code-block .str{color:#ce9178}
.code-block .num{color:#b5cea8}
.code-block .typ{color:#4ec9b0}
.copy-btn{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:8px;letter-spacing:0.12em;padding:5px 12px;background:var(--bg4);border:1px solid var(--border);color:var(--text2);cursor:pointer;text-transform:uppercase;transition:all 0.15s}
.copy-btn:hover{border-color:var(--accent);color:var(--accent)}
.copy-btn.copied{border-color:var(--accent2);color:var(--accent2)}

/* INSTALL STEPS */
.install-list{display:flex;flex-direction:column;gap:3px}
.inst-step{display:grid;grid-template-columns:32px 1fr;gap:12px;padding:12px 14px;background:var(--bg3);align-items:start}
.inst-n{width:28px;height:28px;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--accent);flex-shrink:0}
.inst-title{font-size:12px;font-weight:600;color:var(--bright);margin-bottom:3px}
.inst-detail{font-family:var(--mono);font-size:9px;color:var(--text2);line-height:1.6}
.inst-path{font-family:var(--mono);font-size:9px;color:var(--accent4);background:rgba(255,181,38,0.06);border:1px solid rgba(255,181,38,0.15);padding:4px 10px;margin-top:4px;display:inline-block}

/* CHART MOCKUP */
.mockup{background:#020508;border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.mockup-bar{background:#080f1a;border-bottom:1px solid var(--border);padding:7px 14px;font-family:var(--mono);font-size:9px;color:var(--text2);letter-spacing:0.12em;display:flex;align-items:center;gap:8px}
.mkdot{width:7px;height:7px;border-radius:50%}
.mk-r{background:#ff3d5f}.mk-y{background:#ffb526}.mk-g{background:#00ff99}
.chart-pre{padding:14px 16px;font-family:var(--mono);font-size:10px;line-height:1.85;color:#3d5a70;white-space:pre;overflow-x:auto}
.chart-pre .g{color:#00ff99}.chart-pre .r{color:#ff3d5f}.chart-pre .b{color:#00c8ff}.chart-pre .a{color:#ffb526}.chart-pre .w{color:#ddeeff}
.subgraph-area{border-top:1px solid var(--border);padding:12px 16px}
.bar-strip{display:flex;gap:4px;align-items:flex-end;height:44px;margin-top:6px}
.bs{width:20px;border-top:2px solid;display:flex;align-items:flex-end;justify-content:center;font-family:var(--mono);font-size:7px;padding-bottom:2px}
.bs0{height:5px;border-color:#1e2d3d;color:#1e2d3d;background:rgba(30,45,61,0.2)}
.bs1{height:9px;border-color:#2a3f55;color:#2a3f55;background:rgba(42,63,85,0.2)}
.bs2{height:18px;border-color:#4d7a9f;color:#4d7a9f;background:rgba(77,122,159,0.18)}
.bs3{height:26px;border-color:#ffb526;color:#ffb526;background:rgba(255,181,38,0.14)}
.bs4{height:35px;border-color:#88dd44;color:#88dd44;background:rgba(136,221,68,0.14)}
.bs5{height:44px;border-color:#00ff99;color:#00ff99;background:rgba(0,255,153,0.16)}

/* READ GRID */
.read-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.read-cell{background:var(--bg3);padding:14px}
.read-title{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:6px}
.read-body{font-size:11px;color:var(--text);line-height:1.55}


/* CALLOUTS */
.caveat{background:rgba(255,181,38,0.04);border:1px solid rgba(255,181,38,0.18);padding:14px 18px;margin-bottom:16px}
.caveat-title{font-family:var(--mono);font-size:9px;letter-spacing:0.15em;color:var(--accent4);text-transform:uppercase;margin-bottom:8px}
.caveat-body{font-size:11px;color:var(--text);line-height:1.65}
.caveat-body strong{color:var(--accent4)}
.caveat-body code{font-family:var(--mono);font-size:9px;background:rgba(255,181,38,0.08);padding:1px 5px}
.warn-box{background:rgba(255,61,95,0.04);border:1px solid rgba(255,61,95,0.18);padding:14px 18px;margin-bottom:16px}
.warn-title{font-family:var(--mono);font-size:9px;letter-spacing:0.15em;color:var(--accent3);text-transform:uppercase;margin-bottom:6px}
.warn-body{font-size:11px;color:var(--text);line-height:1.65}
.info-box{background:rgba(0,200,255,0.04);border:1px solid rgba(0,200,255,0.15);padding:14px 18px;margin-bottom:16px}
.info-box p{font-size:12px;color:var(--text);line-height:1.6}
.info-box strong{color:var(--accent)}

/* PROVIDERS */
.provider-list{display:flex;flex-direction:column;gap:3px}
.provider-row{display:grid;grid-template-columns:40px 200px 1fr auto;gap:12px;padding:12px 14px;background:var(--bg3);align-items:start}
.prov-rank{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
.prov-name{font-size:12px;font-weight:600;color:var(--bright);margin-bottom:2px}
.prov-price{font-family:var(--mono);font-size:9px;color:var(--accent4)}
.prov-desc{font-size:11px;color:var(--text);line-height:1.45}
.prov-badge{font-family:var(--mono);font-size:8px;padding:3px 8px;white-space:nowrap;margin-top:2px}
.pb-rec{background:rgba(0,255,153,0.1);color:var(--accent2);border:1px solid rgba(0,255,153,0.25)}
.pb-ok{background:rgba(0,200,255,0.08);color:var(--accent);border:1px solid rgba(0,200,255,0.2)}
.pb-no{background:rgba(255,61,95,0.08);color:var(--accent3);border:1px solid rgba(255,61,95,0.2)}
.pb-pro{background:rgba(255,181,38,0.08);color:var(--accent4);border:1px solid rgba(255,181,38,0.2)}

/* JOURNAL + MISTAKES */
.journal-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.jcell{background:var(--bg3);padding:14px}
.jcell-title{font-family:var(--mono);font-size:9px;letter-spacing:0.12em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.jcell ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.jcell ul li{font-size:11px;color:var(--text);line-height:1.4;padding-left:14px;position:relative}
.jcell ul li::before{content:'→';position:absolute;left:0;font-family:var(--mono);font-size:9px;color:var(--text2)}

/* PARAM */
.param-tbl{width:100%;border-collapse:collapse}
.param-tbl tr{border-bottom:1px solid var(--border)}
.param-tbl tr:last-child{border-bottom:none}
.param-tbl td{padding:9px 12px;font-size:11px;vertical-align:top}
.param-tbl td:first-child{font-family:var(--mono);font-size:9px;color:var(--accent);letter-spacing:0.08em;white-space:nowrap;width:160px}
.param-tbl td:nth-child(2){font-family:var(--mono);font-size:10px;color:var(--accent4);width:70px}
.param-tbl td:last-child{color:var(--text);line-height:1.4}

/* ROADMAP */
.phase-card{background:var(--bg3);border:1px solid var(--border);padding:16px 18px;margin-bottom:12px;position:relative}
.phase-card.todo{border-left:3px solid var(--text2)}
.phase-card.progress{border-left:3px solid var(--accent4)}
.phase-card.passed{border-left:3px solid var(--accent2)}
.phase-card.failed{border-left:3px solid var(--accent3)}
.phase-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.phase-name{font-family:var(--mono);font-size:11px;color:var(--bright);letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
.phase-status-btn{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;padding:4px 10px;border:1px solid;cursor:pointer;text-transform:uppercase;background:transparent}
.phase-status-btn.todo{color:var(--text2);border-color:var(--border)}
.phase-status-btn.progress{color:var(--accent4);border-color:rgba(255,181,38,0.3)}
.phase-status-btn.passed{color:var(--accent2);border-color:rgba(0,255,153,0.3)}
.phase-status-btn.failed{color:var(--accent3);border-color:rgba(255,61,95,0.3)}
.phase-goal{font-size:11px;color:var(--text);margin-bottom:10px;line-height:1.5}


/* FORMS (BACKTEST + CALC) */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.form-grid.three{grid-template-columns:1fr 1fr 1fr}
.form-field{display:flex;flex-direction:column;gap:4px}
.form-field label{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;color:var(--text2);text-transform:uppercase}
.form-field input,.form-field select,.form-field textarea{background:var(--bg3);border:1px solid var(--border);color:var(--bright);font-family:var(--mono);font-size:11px;padding:7px 10px}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{outline:none;border-color:var(--accent)}
.form-field textarea{resize:vertical;min-height:60px;font-family:var(--mono)}
.form-row-checks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.form-row-checks label{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--text);background:var(--bg3);padding:7px 9px;border:1px solid var(--border);cursor:pointer}
.form-row-checks input[type=checkbox]{accent-color:var(--accent2)}
.calc-result{background:var(--bg3);border:1px solid var(--border);padding:14px;margin-top:10px;font-family:var(--mono);font-size:12px}
.calc-result .ok{color:var(--accent2)}.calc-result .bad{color:var(--accent3)}.calc-result .meh{color:var(--accent4)}
.gen-output{background:#020508;border:1px solid var(--border);padding:16px;font-family:var(--mono);font-size:10px;color:#8badc0;white-space:pre-wrap;max-height:400px;overflow:auto;margin-top:10px}

/* FOOTER */
.page-footer{border-top:1px solid var(--border);padding:16px 20px;margin-top:32px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:9px;color:var(--text2);flex-wrap:wrap;gap:10px}
.disclaimer{max-width:600px;line-height:1.5;opacity:0.7;font-size:8px}

/* RESPONSIVE */
@media(max-width:900px){
  .two-col,.three-col,.read-grid{grid-template-columns:1fr}
  .journal-grid{grid-template-columns:1fr 1fr}
  .stat-strip{grid-template-columns:1fr 1fr}
  .score-grid{grid-template-columns:repeat(3,1fr)}
  .form-row-checks{grid-template-columns:repeat(3,1fr)}
  .form-grid,.form-grid.three{grid-template-columns:1fr}
  .nav-tabs{overflow-x:auto}
  .hero-title{font-size:24px}
  .provider-row{grid-template-columns:1fr}
}
@media(max-width:600px){
  .journal-grid{grid-template-columns:1fr}
  .nav-logo-text-wrap{display:none}
  .page-wrap{padding:16px 12px}
}

/* PRINT */
@media print{
  body{background:#fff;color:#111}
  body::after{display:none}
  .topnav,.nav-right,.nav-btn,.btn,.copy-btn,.phase-status-btn{display:none!important}
  .page-wrap{display:block!important;page-break-after:always}
  .panel,.hero{border-color:#ccc;background:#fff;color:#111}
  .panel-hd{background:#f3f3f3;color:#111}
  .stat-card,.cond-row,.flow-step,.score-cell,.read-cell,.jcell,.phase-card{background:#fafafa;color:#111}
  .hero-title,.cond-name,.flow-title,.panel-title,.stat-val{color:#111}
  .cond-desc,.flow-desc,.read-body,.stat-sub{color:#333}
  .code-block{background:#f5f5f5;color:#111;border-color:#ccc;max-height:none}
}
</style>
</head>
